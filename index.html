<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>NyxOS</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cg transform='translate(4 4)' fill='%239db4ff'%3E%3Cpath d='M11.39 3.02A9 9 0 1 0 20.63 14.57A7.5 7.5 0 0 1 11.39 3.02Z'/%3E%3Ccircle cx='17.6' cy='6.6' r='1.05'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>
/* Set theme before first paint to avoid a flash. Mirrors Settings logic below. */
(function(){try{var s=JSON.parse(localStorage.getItem('snap:settings')||'{}')||{};var t=s.theme;if(t==='auto'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}else if(t!=='light'){t='dark';}document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
/* NyxOS design tokens.
   Base is pure black. Three near-black surfaces, hairline borders, one accent
   used sparingly. Spacing is on a 4/8px scale. Motion is short and springy. */
:root{
  --font-ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-display:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px; --fs-3xl:44px;

  /* Springy for transforms (slight overshoot), plain ease-out for fades. */
  --ease-spring:cubic-bezier(.3,1.35,.55,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-in:cubic-bezier(.55,0,.8,.2);
  --dur-1:150ms; --dur-2:200ms; --dur-3:250ms;

  --accent:#9db4ff; --on-accent:#0b0f1c;
  --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 42%,transparent);

  --dock-h:56px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
:root[data-theme="dark"]{
  --bg:#000;
  --s1:#0a0a0b;   /* windows, panels */
  --s2:#111113;   /* raised controls, cards */
  --s3:#19191c;   /* hover, pressed */
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.11); --line-3:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.05); --press:rgba(255,255,255,.085);
  --text:#ececee; --text-2:#9d9da6; --text-3:#65656e;
  --field:#0c0c0e;
  --glass:rgba(12,12,14,.72);
  --shadow-1:0 1px 2px rgba(0,0,0,.6);
  --shadow-2:0 10px 30px rgba(0,0,0,.6);
  --shadow-3:0 28px 80px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.5);
  --danger:#ff7b7b; --ok:#7ed6a7; --warn:#efc46b;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f2f4;
  --s1:#ffffff; --s2:#f6f6f8; --s3:#ececef;
  --line:rgba(12,14,22,.08); --line-2:rgba(12,14,22,.12); --line-3:rgba(12,14,22,.2);
  --hover:rgba(12,14,22,.045); --press:rgba(12,14,22,.08);
  --text:#16171c; --text-2:#5b5d68; --text-3:#8b8d98;
  --field:#ffffff;
  --glass:rgba(255,255,255,.78);
  --shadow-1:0 1px 2px rgba(12,14,22,.08);
  --shadow-2:0 10px 30px rgba(12,14,22,.12);
  --shadow-3:0 28px 70px rgba(12,14,22,.18),0 2px 8px rgba(12,14,22,.08);
  --danger:#d63c3c; --ok:#1d8f5f; --warn:#a86b00;
  color-scheme:light;
}

/* Reduced motion: OS setting or the in-app toggle. */
/* Aliases for the component styles below (replaced in the shell redesign). */
:root{--taskbar-h:56px;--r-win:var(--r-md);--r-ctl:var(--r-sm);--ease:var(--ease-out)}
:root[data-theme]{--muted:var(--text-2);--faint:var(--text-3);--surface:var(--glass);--surface-solid:var(--s1);--raised:var(--hover);--raised-2:var(--press);--shadow:var(--shadow-3)}
.wordmark{display:inline-flex;align-items:baseline;gap:.08em;letter-spacing:0;line-height:1}
.wordmark .wm-nyx{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:1.25em;letter-spacing:-.01em}
.wordmark .wm-os{font-family:var(--font-ui);font-weight:600;font-size:.62em;letter-spacing:.14em;color:var(--text-2)}
.mark{display:block;color:var(--accent)}
h1,h2{font-weight:600;letter-spacing:-.01em}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);font-feature-settings:"ss01";font-size:14px;line-height:1.45;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:#000}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Wallpapers */
body[data-wall="oled"]{background:radial-gradient(rgba(255,255,255,.17) 1px,transparent 1.3px) 13px 13px/26px 26px,#000}
body[data-wall="night"]{background:
  radial-gradient(1.2px 1.2px at 12% 18%,#cfd8ff 60%,transparent),radial-gradient(1px 1px at 72% 12%,#fff 60%,transparent),
  radial-gradient(1.4px 1.4px at 42% 64%,#dfe6ff 60%,transparent),radial-gradient(1px 1px at 86% 72%,#fff 60%,transparent),
  radial-gradient(1px 1px at 25% 84%,#c9d2ff 60%,transparent),radial-gradient(1.2px 1.2px at 58% 34%,#fff 60%,transparent),
  radial-gradient(900px 520px at 78% 100%,rgba(92,82,190,.38),transparent 70%),
  radial-gradient(700px 480px at 8% 0%,rgba(40,96,140,.32),transparent 70%),#10131f}
body[data-wall="dusk"]{background:radial-gradient(1100px 700px at 85% 115%,#4a3f7a,transparent 60%),radial-gradient(900px 600px at 5% -10%,#24506a,transparent 60%),#1a1e2e}
body[data-wall="slate"]{background:#2a2f3b}
body[data-wall="dots"]{background:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px) 0 0/22px 22px,#1b1f2b}
body[data-wall="mist"]{background:radial-gradient(rgba(30,40,70,.12) 1px,transparent 1.2px) 0 0/22px 22px,linear-gradient(#e6e9ef,#d7dce6)}

/* Desktop */
#desktop{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px)}
#dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#icons{z-index:1;position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;flex-wrap:wrap;gap:6px;animation:homeIn .45s var(--ease) both}
.dicon{width:86px;padding:10px 4px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#d9dae2;touch-action:manipulation;transition:background .15s}
.dicon .tile{transition:transform .2s var(--ease),box-shadow .2s}
@media (hover:hover){.dicon:hover .tile{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.8),0 0 20px color-mix(in srgb,var(--accent) 18%,transparent)}}
.dicon:active .tile{transform:scale(.92);transition-duration:.08s}
.dicon:focus-visible{outline:none}
.dicon:focus-visible .tile{outline:2px solid var(--accent);outline-offset:3px}
body[data-wall="mist"] .dicon{color:#1a1f2e;text-shadow:none}
.dicon.sel{background:rgba(255,255,255,.08)}
.dicon > span:last-child{font-size:12.5px;font-weight:500;line-height:1.2;text-align:center}
.tile{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.25)}
.tile .ico{width:24px;height:24px}
.tile.fav{background:#0c0c0f!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 4px 12px rgba(0,0,0,.4)}
.tile.fav img{width:28px;height:28px;object-fit:contain;animation:fadeIn .25s ease both}
.tile .letter{font-size:20px;font-weight:700;color:var(--tint-fg,#fff)}
body[data-wall="mist"] .tile.fav{background:#fff!important}
.tile.sm{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tile.sm .ico{width:16px;height:16px}
#windows{z-index:2;pointer-events:none;position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--taskbar-h) + env(safe-area-inset-bottom,0px))}

/* Home shortcuts */
#home{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 16px var(--taskbar-h)}
.shortcuts{display:flex;gap:22px;pointer-events:auto;animation:homeIn .5s var(--ease) both}
@keyframes homeIn{from{opacity:0;transform:translateY(8px)}}
.sc{width:78px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:9px;border-radius:16px;touch-action:manipulation}
.sc-icon{position:relative;width:54px;height:54px;border-radius:15px;background:#08080a;border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;overflow:hidden;transition:transform .22s var(--ease),border-color .22s,box-shadow .22s}
.sc-icon::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 45%);pointer-events:none}
.sc-icon img{width:30px;height:30px;object-fit:contain;animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}}
.sc-fallback{font-size:20px;font-weight:700;color:var(--tint-fg,#fff)}
.sc-icon.is-fallback{background:var(--tint,#222);border-color:transparent}
.sc .name{font-size:12.5px;font-weight:500;color:#cdced8;letter-spacing:.01em}
@media (hover:hover){.sc:hover .sc-icon{transform:translateY(-4px);border-color:rgba(255,255,255,.2);box-shadow:0 14px 34px rgba(0,0,0,.9),0 0 26px color-mix(in srgb,var(--accent) 22%,transparent)}}
.sc:active .sc-icon{transform:scale(.92);transition-duration:.08s}
.sc:focus-visible{outline:none}
.sc:focus-visible .sc-icon{outline:2px solid var(--accent);outline-offset:4px}
body[data-wall="mist"] .sc .name{color:#1a1f2e}
body[data-wall="mist"] .sc-icon{background:#fff;border-color:rgba(20,30,60,.12)}

/* Mode switch (bottom-left, contextual) */
.mode-btn{flex:none;height:40px;padding:0 15px 0 11px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:#000;border:1px solid var(--line);transition:border-color .2s,transform .12s,background .2s}
:root[data-theme="light"] .mode-btn{background:var(--field)}
.mode-btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.mode-btn:active{transform:scale(.95)}
.mode-btn .ico{color:var(--accent);width:17px;height:17px}
.mode-btn .swap{display:flex;align-items:center;gap:8px;animation:swapIn .22s var(--ease)}
@keyframes swapIn{from{opacity:0;transform:translateY(5px)}}
#clock{margin-left:auto}

/* Browser only mode: the existing browser window fills the viewport */
body.mode-browser{--taskbar-h:52px}
body.mode-browser #icons,body.mode-browser #home,body.mode-browser #launcher-btn,body.mode-browser #running,body.mode-browser #bell-btn,body.mode-browser .panel{display:none!important}
body.mode-browser .win:not([data-app="browser"]){display:none!important}
body.mode-browser .win[data-app="browser"]{display:flex!important;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0;box-shadow:none;animation:modeIn .24s var(--ease)}
body.mode-browser .win[data-app="browser"] .titlebar,body.mode-browser .win[data-app="browser"] .resize{display:none}
@keyframes modeIn{from{opacity:0;transform:scale(.985)}}

/* Glass */
.glass{background:var(--surface);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4)}
:root[data-glass="off"] .glass{background:var(--surface-solid);-webkit-backdrop-filter:none;backdrop-filter:none}

/* Windows */
.win{pointer-events:auto;position:absolute;display:flex;flex-direction:column;border-radius:var(--r-win);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;min-width:320px;min-height:240px;transition:opacity .16s var(--ease),transform .16s var(--ease)}
.win.opening,.win.closing{opacity:0;transform:scale(.965)}
.win.hiding{opacity:0;transform:translateY(24px) scale(.96)}
.win.minimized{display:none}
.win.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0}
.win:not(.focused){box-shadow:0 10px 30px rgba(0,0,0,.28)}
.titlebar{flex:none;height:42px;display:flex;align-items:center;gap:9px;padding:0 6px 0 12px;user-select:none;-webkit-user-select:none;touch-action:none;border-bottom:1px solid var(--line)}
.win:not(.focused) .titlebar>*{opacity:.6}
.win-title{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-controls{display:flex;gap:2px}
.win-btn{width:34px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.win-btn:hover{background:var(--raised-2);color:var(--text)}
.win-btn.close:hover{background:#e5484d;color:#fff}
.win-btn .ico{width:15px;height:15px}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
body.wm-dragging iframe{pointer-events:none}
body.wm-dragging{cursor:grabbing}

/* Taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--taskbar-h) + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);z-index:9000}
.tb-btn{height:42px;min-width:42px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:8px;font-weight:600}
.tb-btn:hover,.tb-btn[aria-expanded="true"]{background:var(--raised-2)}
.tb-btn .brand{width:20px;height:20px;color:var(--accent)}
#running{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#running::-webkit-scrollbar{display:none}
.task{position:relative;flex:none;height:42px;padding:0 12px 0 8px;border-radius:10px;display:flex;align-items:center;gap:8px;max-width:190px;color:var(--muted)}
.task:hover{background:var(--raised)}
.task.active{background:var(--raised-2);color:var(--text)}
.task::after{content:"";position:absolute;left:50%;bottom:3px;width:14px;height:3px;border-radius:2px;background:var(--accent);transform:translateX(-50%);opacity:0;transition:opacity .15s,width .15s}
.task.active::after{opacity:1;width:20px}
.task.min::after{opacity:.45;width:6px}
.task-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500}
#clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:0 10px;height:42px;justify-content:center;border-radius:10px}
#clock:hover{background:var(--raised)}
#clock-time{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#clock-date{font-size:11.5px;color:var(--muted)}
.bell{position:relative}
.bell .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface-solid)}

/* Panels: launcher & notification center */
.panel{position:fixed;bottom:calc(var(--taskbar-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:9100;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:min(560px,calc(100% - var(--taskbar-h) - 40px));animation:panelIn .18s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}}
#launcher{left:10px;width:360px}
#notif-center{right:10px;width:340px}
.panel-head{padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
.panel-head h2{font-size:15px;margin:0;flex:1}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;background:var(--field);border:1px solid var(--line);flex:1}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.search .ico{color:var(--faint)}
.app-list{overflow:auto;padding:4px 8px 8px}
.app-row{width:100%;display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:10px;text-align:left}
.app-row:hover,.app-row:focus-visible{background:var(--raised-2)}
.app-row b{display:block;font-weight:600}
.app-row small{display:block;color:var(--muted);font-size:12.5px}
.panel-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.panel-foot .ico{color:var(--accent)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.notif{padding:10px 12px;margin:0 8px 6px;border-radius:10px;background:var(--raised)}
.notif b{display:block;font-size:13.5px}
.notif p{margin:2px 0 0;color:var(--muted);font-size:13px}
.notif time{font-size:11.5px;color:var(--faint)}

/* Toasts */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:9500;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px 10px 12px 14px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);animation:toastIn .22s var(--ease)}
.toast.out{opacity:0;transform:translateX(16px);transition:.18s}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}}
.toast div{flex:1;min-width:0}
.toast b{display:block;font-size:13.5px}
.toast p{margin:2px 0 0;color:var(--muted);font-size:13px}
.toast button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.toast button:hover{background:var(--raised-2)}

/* Shared controls */
.btn{height:36px;padding:0 14px;border-radius:var(--r-ctl);background:var(--raised-2);font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.field{height:38px;padding:0 11px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--field);outline:none;min-width:0}
.field:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.app-error{margin:auto;max-width:420px;padding:28px 24px;text-align:center}
.app-error h2{font-size:17px;margin:0 0 6px}
.app-error p{color:var(--muted);margin:0 0 18px;word-break:break-word}
.app-error .row{justify-content:center}

/* Browser */
.br{display:flex;flex-direction:column;height:100%}
.br-tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 4px 0 8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.br-tabs::-webkit-scrollbar{display:none}
.br-tab{flex:0 1 200px;min-width:120px;height:34px;display:flex;align-items:center;gap:6px;padding:0 4px 0 12px;border-radius:9px 9px 0 0;color:var(--muted);position:relative}
.br-tab:hover{background:var(--raised)}
.br-tab.active{background:var(--surface-solid);color:var(--text)}
:root[data-glass="on"] .br-tab.active{background:var(--raised-2)}
.br-tab .t{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:500;height:100%}

.br-views{flex:1;min-height:0;position:relative;background:var(--surface-solid)}

.ntp{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:12vh 20px 30px}

/* Settings */
.st{display:flex;height:100%;min-height:0}
.st-nav{width:200px;flex:none;padding:10px 8px;border-right:1px solid var(--line);overflow:auto}

.wall i{display:block;height:72px;border-radius:9px;border:1px solid var(--line)}

/* Customize screen (first run, and Settings > Appearance) */
@property --mx{syntax:'<length-percentage>';inherits:false;initial-value:30%}
@property --my{syntax:'<length-percentage>';inherits:false;initial-value:40%}

.cz-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}

.cz-prev{position:sticky;top:16px}

.cz-wall{position:relative;aspect-ratio:16/10;border-radius:14px;border:1px solid var(--line);overflow:hidden;touch-action:pan-y}
.cz-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(var(--accent) 1.5px,transparent 2px) 13px 9px/26px 26px;-webkit-mask:radial-gradient(circle 70px at var(--mx) var(--my),#000,transparent);mask:radial-gradient(circle 70px at var(--mx) var(--my),#000,transparent);animation:czRoam 8s ease-in-out infinite alternate}
.cz-wall.live .cz-glow{animation:none}
@keyframes czRoam{0%{--mx:18%;--my:28%}35%{--mx:78%;--my:22%}70%{--mx:62%;--my:70%}100%{--mx:24%;--my:66%}}
.cz-win{position:absolute;left:9%;top:10%;width:62%;height:58%;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.cz-win header{flex:none;height:24px;display:flex;align-items:center;gap:5px;padding:0 9px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600}
.cz-win header i{width:7px;height:7px;border-radius:50%;background:var(--raised-2)}
.cz-win header span{margin-left:4px}
.cz-win .body{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:7px}
.cz-win .ln{height:7px;width:85%;border-radius:4px;background:var(--raised-2)}
.cz-win .ln.s{width:55%}
.cz-win .row{margin-top:auto;flex-wrap:nowrap}
.cz-win .pill{height:22px;padding:0 10px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-flex;align-items:center}
.cz-win .switch{transform:scale(.72);transform-origin:left center}
.cz-tb{position:absolute;left:0;right:0;bottom:0;height:30px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}
.cz-tb .ico{width:16px;height:16px;color:var(--accent)}
.cz-tb i{width:40px;height:16px;border-radius:5px;background:var(--raised-2);position:relative}
.cz-tb i.on::after{content:"";position:absolute;left:50%;bottom:2px;width:12px;height:2px;border-radius:1px;background:var(--accent);transform:translateX(-50%)}
.cz-tb time{margin-left:auto;font-size:11px;font-weight:600}
.cz-opts{display:flex;flex-direction:column;gap:14px}
.cz-sec{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--raised)}
.cz-sec h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}
.cz-line{display:flex;align-items:center;gap:16px}
.cz-line .lbl{flex:1;min-width:0}
.cz-line .lbl b{display:block;font-weight:600}
.cz-line .lbl small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.cz .walls{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cz .wall i{height:54px}
.cz-custom{position:relative;background:conic-gradient(#ff6b6b,#f2b44c,#5fd3b0,#7aa2ff,#b48cff,#f27a9b,#ff6b6b)}

.cz-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.cz-custom:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.cz-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:22px;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 28%)}
:root[data-theme="light"] .cz-foot{background:linear-gradient(transparent,var(--surface-solid) 28%)}
.cz-foot .btn{height:42px;padding:0 22px}
.cz-foot .note{margin:0 auto 0 0;color:var(--muted);font-size:12.5px}

/* Launch prompt (Ask on launch) */
#launch-prompt{position:fixed;left:12px;right:12px;margin:0 auto;width:min(420px,calc(100% - 24px));bottom:calc(var(--taskbar-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:9200;padding:14px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:panelIn .2s var(--ease)}
#launch-prompt b{display:block;font-size:14px}
#launch-prompt p{margin:2px 0 0;color:var(--muted);font-size:13px}
#launch-prompt p.msg{margin-top:6px}
#launch-prompt p.msg.err{color:var(--danger)}
#launch-prompt .row{justify-content:flex-end}

/* Boot & fatal */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#000;transition:opacity .35s}
#boot.done{opacity:0;pointer-events:none}
#boot svg{width:44px;height:44px;color:var(--accent)}
@keyframes pulse{50%{opacity:.45}}
#fatal{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:#000;color:#e9ebf3}
#fatal div{max-width:440px}

/* Mobile */
@media (max-width:720px){
  :root{--taskbar-h:60px}

  .titlebar{height:48px}

  .task{padding:0 10px}
  .task-label,.tb-btn .lbl,#clock-date{display:none}
  #launcher,#notif-center{left:8px;right:8px;width:auto}
  #icons{display:grid;grid-template-columns:repeat(var(--icon-cols,5),minmax(0,1fr));left:8px;right:8px;gap:2px}
  .dicon{width:auto;padding:10px 2px 8px}
  .dicon > span:last-child{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .br-tab{min-width:110px}
  .br-bar .ibtn.opt{display:none}
  .st{flex-direction:column}
  .st-nav{width:auto;display:flex;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px;overflow-x:auto;flex:none}
  .st-nav button{width:auto;flex:none;height:40px}
  .st-main{padding:18px 16px 40px}
  .srow{flex-wrap:wrap}
  .ntp{padding-top:7vh}
  .shortcuts{gap:12px}
  .sc{width:74px}
  .sc-icon{width:52px;height:52px;border-radius:14px}
  .mode-btn{height:42px;padding:0 13px 0 10px}
  #taskbar{gap:6px;padding-left:8px}
  .cz-in{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 0}
  .cz-head{margin-bottom:16px}
  .cz-head h1{font-size:20px}
  .cz-head .ico{width:34px;height:34px}
  .cz-grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .cz-prev{position:static}
  .cz-foot{flex-wrap:wrap;margin-top:16px}
  .cz-foot .note{flex-basis:100%}
  .cz-foot .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before,:root[data-motion="reduce"] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

/* ---------- Storage (namespaced, never throws) ---------- */
const NS = 'snap:';
const Store = {
  get(k, fb) { try { const raw = localStorage.getItem(NS + k); return raw == null ? fb : JSON.parse(raw); } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch { return false; } },
  remove(k) { try { localStorage.removeItem(NS + k); } catch {} },
  clearAll() { try { Object.keys(localStorage).filter(k => k.startsWith(NS)).forEach(k => localStorage.removeItem(k)); } catch {} },
  available() { try { localStorage.setItem(NS + 'probe', '1'); localStorage.removeItem(NS + 'probe'); return true; } catch { return false; } },
  bytes() { let n = 0; try { for (const k of Object.keys(localStorage)) if (k.startsWith(NS)) n += (k.length + (localStorage.getItem(k) || '').length) * 2; } catch {} return n; },

  m: new Map(),
  on(e, f) { if (!this.m.has(e)) this.m.set(e, new Set()); this.m.get(e).add(f); return () => this.m.get(e).delete(f); },
  emit(e, d) { (this.m.get(e) || []).forEach(f => { try { f(d); } catch (err) { console.error(err); } }); },

/* ---------- URL helpers ---------- */

const ENGINES = {
  duckduckgo: { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
  brave: { name: 'Brave Search', url: 'https://search.brave.com/search?q=' },
  google: { name: 'Google', url: 'https://www.google.com/search?q=' },
  bing: { name: 'Bing', url: 'https://www.bing.com/search?q=' },

/* ---------- Browser networking layer (separate from the browser UI) ----------
   A transport turns a target URL into the URL the tab frame actually loads.
   'direct' embeds the site as-is: no proxying happens. Sites that send
   X-Frame-Options or a frame-ancestors CSP will refuse to show.
   'prefix' hands the URL to a proxy server you run yourself. Register more
   transports with BrowserNet.register(id, {label, description, resolve}). */
const BrowserNet = {
  transports: {
    direct: {
      label: 'Direct',
      description: 'Loads sites straight into the tab. No proxy is involved, so sites that block embedding stay blank.',
      resolve: (url) => url,
    },
    prefix: {
      label: 'Your proxy server',
      description: 'Sends each address to a server you run, appended to its address as an encoded URL.',
      resolve: (url) => {
        const p = Settings.get('proxyPrefix');
        if (!p) throw Object.assign(new Error('No proxy server is set.'), { hint: 'Add your server address in Settings › Browser, or switch the connection back to Direct.' });
        return p + encodeURIComponent(url);
      },
    },
  },
  register(id, t) {
    if (!id || !t || typeof t.resolve !== 'function') throw new Error('A transport needs an id and a resolve(url) function.');
    this.transports[id] = t;

  current() { return this.transports[Settings.get('transport')] || this.transports.direct; },
  resolve(url) { return this.current().resolve(url); },

/* ---------- Settings ---------- */
const bool = v => typeof v === 'boolean';
const WALLPAPERS = [
  { id: 'oled', name: 'OLED dots' }, { id: 'night', name: 'Night sky' }, { id: 'dusk', name: 'Dusk' }, { id: 'slate', name: 'Slate' },
  { id: 'dots', name: 'Dot grid' }, { id: 'mist', name: 'Mist' },
];
const DEFAULT_ACCENT = '#9db4ff';
const ACCENTS = [
  { v: '#9db4ff', n: 'Moonlight' }, { v: '#d5d9e2', n: 'Silver' }, { v: '#7fd3b8', n: 'Mint' },
  { v: '#eeb868', n: 'Amber' }, { v: '#ee93a9', n: 'Rose' }, { v: '#b7a8f5', n: 'Lilac' },

const SCHEMA = {
  theme: { def: 'dark', valid: v => ['auto', 'light', 'dark'].includes(v) },
  accent: { def: DEFAULT_ACCENT, valid: v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) },
  glass: { def: true, valid: bool },
  reduceMotion: { def: false, valid: bool },
  wallpaper: { def: 'oled', valid: v => WALLPAPERS.some(w => w.id === v) },
  dotMotion: { def: true, valid: bool },
  desktopIcons: { def: true, valid: bool },
  clock24: { def: false, valid: bool },
  clockSeconds: { def: false, valid: bool },
  showDate: { def: true, valid: bool },
  searchEngine: { def: 'duckduckgo', valid: v => Object.prototype.hasOwnProperty.call(ENGINES, v) },
  homepage: { def: '', valid: v => v === '' || isHttpUrl(v) },
  saveHistory: { def: true, valid: bool },
  embedHint: { def: true, valid: bool },
  transport: { def: 'direct', valid: v => Object.prototype.hasOwnProperty.call(BrowserNet.transports, v) },
  proxyPrefix: { def: '', valid: v => v === '' || isHttpUrl(v) },
  notifications: { def: true, valid: bool },
  askLaunch: { def: false, valid: bool },

const Settings = {
  values: {},
  load() {

    // v2: one-time move to the OLED look for settings saved by version 1.
    if (ver < 2 && saved && Object.keys(saved).length) { this.values.theme = 'dark'; this.values.wallpaper = 'oled'; }
    // v3 (NyxOS): people still on the old default accent get the new moonlight default.
    if (ver < 3 && this.values.accent.toLowerCase() === '#7aa2ff') this.values.accent = DEFAULT_ACCENT;
    if (ver < 3) {

  get(k) { return this.values[k]; },
  set(k, v) {

    this.values[k] = v;
    if (!Store.set('settings', this.values)) Notify.push({ title: 'Settings not saved', body: 'This browser is blocking storage. Changes last until you reload.' });
    Bus.emit('settings', { key: k, value: v });
  },
  // Several values in one write: one storage warning at most, one bulk 'settings' event.
  setMany(obj) {

      if (!SCHEMA[k].valid(v)) throw new Error(`That value isn't allowed for this setting.`);
    }
    Object.assign(this.values, obj);
    if (!Store.set('settings', this.values)) Notify.push({ title: 'Settings not saved', body: 'This browser is blocking storage. Changes last until you reload.' });

  },
  import(obj) {

    Store.set('settings', this.values);

  },
  reset() {
    for (const [k, s] of Object.entries(SCHEMA)) this.values[k] = s.def;

/* ---------- Appearance ---------- */
const darkMq = matchMedia('(prefers-color-scheme: dark)');
function onAccent(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#0b0f1c' : '#ffffff';

function applyAppearance() {
  const root = document.documentElement;
  const t = Settings.get('theme');
  root.dataset.theme = t === 'auto' ? (darkMq.matches ? 'dark' : 'light') : t;
  root.style.setProperty('--accent', Settings.get('accent'));
  root.style.setProperty('--on-accent', onAccent(Settings.get('accent')));
  root.dataset.glass = Settings.get('glass') ? 'on' : 'off';
  root.dataset.motion = Settings.get('reduceMotion') ? 'reduce' : 'full';
  document.body.dataset.wall = Settings.get('wallpaper');
  $('#icons').hidden = !Settings.get('desktopIcons');
  $('#clock-date').style.display = Settings.get('showDate') ? '' : 'none';
}
const motionOff = () => Settings.get('reduceMotion') || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (darkMq.addEventListener) darkMq.addEventListener('change', () => { if (Settings.get('theme') === 'auto') applyAppearance(); });

/* ---------- Notifications ---------- */
const Notify = {
  log: [],
  push({ title, body = '', app = '' }) {
    const n = { id: uid(), title, body, app, t: Date.now() };
    this.log.unshift(n);
    this.log.length = Math.min(this.log.length, 50);
    if (Settings.get('notifications') !== false) showToast(n);
    renderNotifs();
    return n.id;
  },
  clear() { this.log = []; renderNotifs(); },
};
function showToast(n) {
  const t = h('div', { class: 'toast glass', role: 'status' },
    h('div', null, h('b', { text: n.title }), n.body ? h('p', { text: n.body }) : null),
    h('button', { 'aria-label': 'Dismiss', svg: ICONS.close, onclick: () => dismiss() }));
  let gone = false;
  const dismiss = () => { if (gone) return; gone = true; t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  $('#toasts').append(t);
  while ($('#toasts').children.length > 4) $('#toasts').firstElementChild.remove();
  setTimeout(dismiss, 4500);
}
let unseen = false;
function renderNotifs() {
  const list = $('#notif-list');
  list.replaceChildren(...(Notify.log.length ? Notify.log.map(n => h('div', { class: 'notif' },
    h('b', { text: n.title }), n.body ? h('p', { text: n.body }) : null,
    h('time', { text: (n.app ? n.app + ', ' : '') + new Date(n.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) })))
    : [h('p', { class: 'empty', text: 'No notifications yet.' })]));

  $('#bell-btn .dot').hidden = !unseen;
  $('#notif-clear').disabled = !Notify.log.length;
}

/* ---------- App registry ---------- */
const Apps = new Map();
function registerApp(def) {
  for (const k of ['id', 'name', 'icon', 'mount']) if (!def[k]) throw new Error(`App definition is missing "${k}".`);
  if (Apps.has(def.id)) throw new Error(`An app with id "${def.id}" is already registered.`);
  Apps.set(def.id, Object.assign({ single: true, size: [900, 620], description: '', tint: '#4b5563' }, def));
  Bus.emit('apps');

const appTile = (app, sm) => h('span', { class: 'tile' + (sm ? ' sm' : ''), style: `background:${app.tint}`, svg: app.icon });

  area: () => $('#windows').getBoundingClientRect(),

    if (appId !== 'browser' && typeof Mode !== 'undefined' && Mode.current === 'browser') Mode.set('os');
    if (app.single) {
      const ex = [...this.wins.values()].find(w => w.appId === appId);
      if (ex) {
        this.restore(ex.id);

    const top = Math.max(12, Math.round((a.height - ht) / 2 - 30 + off));

    const maxBtn = h('button', { class: 'win-btn max', 'aria-label': 'Maximize', title: 'Maximize', svg: ICONS.max });

/* ---------- Browser input parsing ---------- */
function parseInput(raw) {

  const scheme = s.match(/^([a-z][a-z0-9+.-]*):/i);
  if (scheme && !hostLike.test(s)) {
    const p = scheme[1].toLowerCase();
    if (p === 'http' || p === 'https') {
      try { return { kind: 'web', url: new URL(s).href }; } catch { /* fall through to search */ }

      return { kind: 'blocked', url: s, scheme: p };

  if (!/\s/.test(s) && hostLike.test(s)) {
    const local = /^(localhost|\d{1,3}(\.\d{1,3}){3})/i.test(s);
    try { return { kind: 'web', url: new URL((local ? 'http://' : 'https://') + s).href }; } catch {}

function wallCss(id) {
  const tmp = document.createElement('div');
  document.body.append(tmp);
  const prev = document.body.dataset.wall;
  document.body.dataset.wall = id;
  const cs = getComputedStyle(document.body);
  const out = { backgroundColor: cs.backgroundColor, backgroundImage: cs.backgroundImage, backgroundSize: cs.backgroundSize, backgroundPosition: cs.backgroundPosition };
  document.body.dataset.wall = prev;
  tmp.remove();
  return out;
}

/* ---------- Home screen shortcuts ----------
   Each opens its URL through the existing browser (new tab), never by
   navigating this page away. Icons load in the background; a letter tile
   shows until (or instead of) the real favicon. */
const GN_MATH_URL = 'https://gn-math.dev/';
const favicon = (domain, origin) => [`https://www.google.com/s2/favicons?domain=${domain}&sz=128`, `${origin}/favicon.ico`];
const Shortcuts = [];
function registerShortcut(def) {
  if (!def || !def.id || !def.name || !isHttpUrl(def.url)) throw new Error('A shortcut needs an id, a name and an http(s) url.');
  if (Shortcuts.some(s => s.id === def.id)) throw new Error(`A shortcut with id "${def.id}" already exists.`);
  Shortcuts.push(Object.assign({ icons: [], letter: def.name[0] }, def));
  if (booted) renderIcons();
}
function iconWithFallback(sources, letter, tint, tintFg) {
  const box = h('span', { class: 'tile', 'aria-hidden': 'true', style: `background:${tint || '#3a3f4b'};--tint-fg:${tintFg || '#fff'}` }, h('span', { class: 'letter', text: letter }));
  let i = 0, timer = 0;
  const img = new Image();
  img.alt = ''; img.decoding = 'async'; img.draggable = false; img.referrerPolicy = 'no-referrer';
  const next = () => {
    clearTimeout(timer);
    if (i >= sources.length) return; // keep the letter tile
    img.src = sources[i++];
    timer = setTimeout(next, 6000);
  };
  img.onload = () => {
    clearTimeout(timer);
    if (img.naturalWidth < 8) { next(); return; } // placeholder or empty icon
    box.classList.add('fav');
    box.replaceChildren(img);
  };
  img.onerror = next;
  next();
  return box;
}

/* ---------- Interactive OLED dot field ----------
   One canvas, one set of pointer listeners on window, one rAF loop that
   only runs while dots are moving. Each dot eases toward a lift computed
   from a Gaussian of its distance to the pointer. */
const Dots = (() => {
  const cv = $('#dots');
  let ctx = null;
  try { ctx = cv.getContext('2d', { alpha: false }); } catch {}
  const coarse = matchMedia('(pointer: coarse)').matches;
  const lowPower = coarse && ((navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 2);
  let W = 0, H = 0, dpr = 1, S = 26, n = 0, xs = null, ys = null, lift = null;
  let px = -1e5, py = -1e5, strength = 0, target = 0, running = false, raf = 0;
  let enabled = false, motion = false, accent = DEFAULT_ACCENT;

  function layout() {
    if (!ctx) return;
    S = coarse ? 30 : 26;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const cols = Math.floor(W / S) + 1, rows = Math.floor(H / S) + 1;
    const ox = (W - (cols - 1) * S) / 2, oy = (H - (rows - 1) * S) / 2;
    n = cols * rows; xs = new Float32Array(n); ys = new Float32Array(n); lift = new Float32Array(n);
    for (let r = 0, i = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) { xs[i] = ox + c * S; ys[i] = oy + r * S; }
    draw();
  }
  function draw() {
    if (!ctx || !enabled) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const TAU = Math.PI * 2;
    // Resting dots in a single path.
    ctx.fillStyle = 'rgba(255,255,255,0.17)';
    ctx.beginPath();
    for (let i = 0; i < n; i++) if (lift[i] < 0.03) { ctx.moveTo(xs[i] + 1, ys[i]); ctx.arc(xs[i], ys[i], 1, 0, TAU); }
    ctx.fill();
    // Raised dots: a faint shadow where the dot sat, the dot lifted above it.
    for (let i = 0; i < n; i++) {
      const l = lift[i];
      if (l < 0.03) continue;
      const x = xs[i] + (px - xs[i]) * 0.03 * l, y = ys[i] - l * 8;
      ctx.globalAlpha = 0.1 * l; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(xs[i], ys[i] + 1, 1 + l * 0.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = Math.min(1, 0.2 + l * 0.8);
      ctx.fillStyle = l > 0.55 ? accent : '#fff';
      ctx.beginPath(); ctx.arc(x, y, 1 + l * 1.7, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function frame() {
    strength += (target - strength) * 0.12;
    if (Math.abs(target - strength) < 0.002) strength = target;
    const sigma = S * 2.4, inv = 1 / (2 * sigma * sigma), cut = 9 * sigma * sigma;
    let moving = strength !== target;
    for (let i = 0; i < n; i++) {
      let t = 0;
      if (strength > 0.002) {
        const dx = xs[i] - px, dy = ys[i] - py, d2 = dx * dx + dy * dy;
        if (d2 < cut) t = strength * Math.exp(-d2 * inv);
      }
      const cur = lift[i], nv = cur + (t - cur) * 0.16;
      if (Math.abs(nv - t) < 0.002) lift[i] = t; else { lift[i] = nv; moving = true; }
    }
    draw();
    if (moving) raf = requestAnimationFrame(frame); else running = false;
  }
  function kick() { if (!running && enabled && motion && ctx) { running = true; raf = requestAnimationFrame(frame); } }
  function onMove(e) {
    if (!enabled || !motion) return;
    if (e.pointerType === 'touch' && e.type === 'pointermove' && !touching) return;
    px = e.clientX; py = e.clientY;
    const overUi = e.target && e.target.closest && e.target.closest('.win,#taskbar,.panel,.cz,#launch-prompt');
    target = overUi ? 0 : 1;
    kick();
  }
  let touching = false;
  addEventListener('pointermove', onMove, { passive: true });
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touching = true; onMove(e); }, { passive: true });
  const release = e => { if (e.pointerType === 'touch') { touching = false; target = 0; kick(); } };
  addEventListener('pointerup', release, { passive: true });
  addEventListener('pointercancel', release, { passive: true });
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) { target = 0; kick(); } });
  addEventListener('blur', () => { target = 0; kick(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); running = false; }
    else if (enabled && lift) { target = 0; kick(); draw(); }
  });
  let rz = 0;
  addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (enabled) layout(); }); });

  return {
    configure() {
      enabled = !!ctx && Settings.get('wallpaper') === 'oled';
      motion = enabled && Settings.get('dotMotion') && !motionOff() && !lowPower;
      cv.hidden = !enabled;
      accent = Settings.get('accent');
      if (!enabled) { cancelAnimationFrame(raf); running = false; return; }
      if (!lift || W !== window.innerWidth || H !== window.innerHeight) layout();
      if (!motion) { lift.fill(0); target = strength = 0; }
      draw();
    },
    lowPower,
  };
})();
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => Dots.configure());

/* ---------- Customize screen ----------
   Shown once on first run and from Settings › Appearance. Edits a draft of
   the look settings and previews it live; Done saves the draft through
   Settings, Skip/Cancel puts the saved look back. Either way the

const LOOK_KEYS = ['theme', 'accent', 'wallpaper', 'dotMotion'];
const Customize = {

    if (this.finish) return;

    const theme = () => draft.theme === 'auto' ? (darkMq.matches ? 'dark' : 'light') : draft.theme;
    togglePanel($('#launcher'), $('#launcher-btn'), false);

    const themeBtns = [['dark', 'Dark'], ['light', 'Light']].map(([v, n]) =>
      h('button', { type: 'button', role: 'radio', 'data-v': v, text: n, onclick: () => { draft.theme = v; update(); } }));
    const accentBtns = ACCENTS.map(a => h('button', { type: 'button', class: 'swatch', role: 'radio', 'data-v': a.v, style: `background:${a.v}`, 'aria-label': a.n, title: a.n, onclick: () => { draft.accent = a.v; update(); } }));
    const picker = h('input', { type: 'color', value: draft.accent.toLowerCase(), 'aria-label': 'Custom accent color', title: 'Custom color' });
    const custom = h('span', { class: 'swatch cz-custom' }, picker);
    const pick = () => { draft.accent = picker.value.toLowerCase(); update(); };
    picker.addEventListener('input', pick);
    picker.addEventListener('change', pick);
    const wallBtns = WALLPAPERS.map(w => {
      const sample = h('i'); Object.assign(sample.style, wallCss(w.id));
      return h('button', { type: 'button', class: 'wall', role: 'radio', 'data-v': w.id, onclick: () => { draft.wallpaper = w.id; update(); } }, sample, w.name);
    });
    const dotSw = h('button', { type: 'button', class: 'switch', role: 'switch', 'aria-labelledby': 'cz-dots-t', onclick: () => { draft.dotMotion = !draft.dotMotion; update(); } });
    const dotNote = h('small');

    const glow = h('div', { class: 'cz-glow' });
    const clock = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: !Settings.get('clock24') });
    const wall = h('div', { class: 'cz-wall', 'aria-hidden': 'true' }, glow,
      h('div', { class: 'cz-win glass' },
        h('header', null, h('i'), h('i'), h('i'), h('span', { text: 'Settings' })),
        h('div', { class: 'body' }, h('span', { class: 'ln' }), h('span', { class: 'ln s' }), h('span', { class: 'ln' }),
          h('div', { class: 'row' }, h('span', { class: 'pill', text: 'Button' }), h('span', { class: 'switch', 'aria-checked': 'true' })))),
      h('div', { class: 'cz-tb glass' }, h('span', { svg: ICONS.logo }), h('i', { class: 'on' }), h('i'), h('time', { text: clock })));
    // Lifted dots follow the pointer over the preview, and roam on their own otherwise.
    wall.addEventListener('pointermove', e => {
      const r = wall.getBoundingClientRect();
      glow.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      glow.style.setProperty('--my', (e.clientY - r.top) + 'px');
      wall.classList.add('live');
    });
    wall.addEventListener('pointerleave', () => wall.classList.remove('live'));

    const sec = (title, ...kids) => h('section', { class: 'cz-sec' }, h('h2', { text: title }), ...kids);
    const storageOk = Store.available();
    const el = h('div', { class: 'cz', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cz-title', 'aria-describedby': 'cz-desc', tabindex: '-1' },
      h('div', { class: 'cz-in' },
        h('header', { class: 'cz-head' }, h('span', { svg: ICONS.logo }), h('div', null,
          h('h1', { id: 'cz-title', text: first ? 'Make it yours' : 'Customize' }),
          h('p', { id: 'cz-desc', text: 'Pick a look. You can change it any time in Settings › Appearance.' }))),
        h('div', { class: 'cz-grid' },
          h('figure', { class: 'cz-prev', style: 'margin:0' }, wall, h('figcaption', { text: 'Live preview' })),
          h('div', { class: 'cz-opts' },
            sec('Theme', h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Theme' }, themeBtns)),
            sec('Accent color', h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Accent color' }, accentBtns, custom)),
            sec('Wallpaper', h('div', { class: 'walls', role: 'radiogroup', 'aria-label': 'Wallpaper' }, wallBtns)),
            sec('Effects', h('div', { class: 'cz-line' }, h('div', { class: 'lbl' }, h('b', { id: 'cz-dots-t', text: 'Dot animation' }), dotNote), dotSw)))),
        h('footer', { class: 'cz-foot' },
          storageOk ? null : h('p', { class: 'note', text: 'This browser is blocking storage, so your choices last until you reload.' }),
          h('button', { class: 'btn', type: 'button', text: first ? 'Skip' : 'Cancel', onclick: () => this.close(false) }),
          h('button', { class: 'btn primary', type: 'button', text: 'Done', onclick: () => this.close(true) }))));

    function update() {
      const t = theme(), root = document.documentElement, preset = ACCENTS.some(a => a.v === draft.accent);
      root.dataset.theme = t;
      root.style.setProperty('--accent', draft.accent);
      root.style.setProperty('--on-accent', onAccent(draft.accent));
      themeBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === t)));
      accentBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === draft.accent)));
      custom.classList.toggle('on', !preset);
      custom.style.background = preset ? '' : draft.accent;
      if (picker.value !== draft.accent.toLowerCase()) picker.value = draft.accent.toLowerCase();
      wallBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === draft.wallpaper)));
      Object.assign(wall.style, wallCss(draft.wallpaper));
      dotSw.setAttribute('aria-checked', String(draft.dotMotion));
      const oled = draft.wallpaper === 'oled';
      glow.hidden = !(oled && draft.dotMotion && !motionOff() && !Dots.lowPower);
      dotNote.textContent = !oled ? 'Shows on the OLED dots wallpaper.' : Dots.lowPower ? 'Off automatically on this device to save power.'
        : motionOff() ? 'Paused while reduced motion is on.' : 'Dots lift toward your pointer.';
    }

    el.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); this.close(false); return; }
      if (e.key !== 'Tab') return;
      const f = [...el.querySelectorAll('button,input')].filter(x => !x.disabled && x.getClientRects().length);
      if (!f.length) return;
      const a = document.activeElement;
      if (e.shiftKey && (a === f[0] || a === el)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    });

    const behind = [$('#desktop'), $('#taskbar'), $('#launch-prompt')].filter(Boolean);
    behind.forEach(x => { x.inert = true; });
    document.body.append(el);
    update();
    el.focus({ preventScroll: true });

    this.finish = (save) => {
      this.finish = null;
      if (save) { try { Settings.setMany(draft); } catch (err) { applyAppearance(); Notify.push({ title: 'Look not saved', body: err.message }); } }
      else applyAppearance();
      Store.set('customized', true);
      el.remove();
      behind.forEach(x => { x.inert = false; });
      const back = opener && opener !== document.body && opener.isConnected ? opener : $('[data-customize]');
      if (back) back.focus({ preventScroll: true });
      if (onClose) { try { onClose(); } catch (err) { console.error(err); } }
    };
  },
  close(save) { if (this.finish) this.finish(save); },
};

/* ---------- Launch: open this site inside an about:blank tab ----------
   The new tab stays at about:blank and holds a full-screen iframe of this
   page. The frame copy gets ?snap-ab=1 and also checks whether it is framed,
   so it never shows the launch prompt again. */
const Launch = {
  framed: (() => {
    try { if (window.top !== window.self) return true; } catch { return true; }
    try { return new URLSearchParams(location.search).get('snap-ab') === '1'; } catch { return false; }
  })(),
  frameUrl() { const u = new URL(location.href); u.hash = ''; u.searchParams.set('snap-ab', '1'); return u.href; },
  open() {
    let w = null;
    try { w = window.open('about:blank', '_blank'); } catch {}
    if (!w || w.closed) {
      Notify.push({ title: 'Pop-up blocked', body: 'Your browser stopped the new tab. Click the blocked pop-up icon in the address bar (or open site settings), choose to always allow pop-ups for this site, then try again.' });
      return false;
    }
    try {
      const d = w.document;
      if (!d.head) d.documentElement.prepend(d.createElement('head'));
      if (!d.body) d.documentElement.append(d.createElement('body'));
      d.title = document.title;
      const meta = d.createElement('meta');
      meta.name = 'viewport'; meta.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
      const icon = d.createElement('link');
      icon.rel = 'icon'; icon.href = ($('link[rel="icon"]') || {}).href || '';
      d.head.append(meta, icon);
      d.documentElement.style.cssText = 'height:100%;background:#000';
      d.body.style.cssText = 'margin:0;height:100%;overflow:hidden;background:#000';
      const f = d.createElement('iframe');
      f.title = document.title;
      f.allow = 'fullscreen; clipboard-read; clipboard-write; autoplay; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000';
      f.src = this.frameUrl();
      d.body.append(f);
      try { w.focus(); } catch {}
      return true;
    } catch (err) {
      console.error(err);
      try { w.close(); } catch {}
      Notify.push({ title: 'Couldn’t open about:blank', body: 'The new tab couldn’t be set up. This site keeps working here.' });
      return false;
    }
  },
};
// Ask on launch: a click is needed, because browsers block pop-ups opened without one.
function showLaunchPrompt() {
  if (Launch.framed || !Settings.get('askLaunch') || $('#launch-prompt')) return;
  const msg = h('p', { class: 'msg', 'aria-live': 'polite' });
  const close = () => card.remove();
  const openBtn = h('button', { class: 'btn primary', type: 'button', text: 'Open in about:blank', onclick: () => {
    if (Launch.open()) close();
    else { msg.textContent = 'Pop-ups are blocked. Allow pop-ups for this site, then try again.'; msg.className = 'msg err'; }
  } });
  const card = h('div', { id: 'launch-prompt', class: 'glass', role: 'dialog', 'aria-labelledby': 'lp-title', 'aria-describedby': 'lp-desc' },
    h('div', null, h('b', { id: 'lp-title', text: 'Open in about:blank?' }),
      h('p', { id: 'lp-desc', text: 'Runs this site in a new tab whose address bar shows about:blank. Turn this prompt off in Settings › Launch.' }), msg),
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', text: 'Not now', onclick: close }), openBtn));
  card.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.body.append(card);
  openBtn.focus({ preventScroll: true });
}

/* ---------- OS / Browser only mode ---------- */
const Mode = {
  current: 'os',
  set(m, { save = true } = {}) {
    if (m !== 'os' && m !== 'browser') return;
    this.current = m;
    document.body.classList.toggle('mode-browser', m === 'browser');
    togglePanel($('#launcher'), $('#launcher-btn'), false);
    if (m === 'browser') {
      const id = WM.open('browser');
      if (id) WM.restore(id);
    }
    renderModeBtn();
    if (save) Store.set('mode', m);
  },
  toggle() { this.set(this.current === 'os' ? 'browser' : 'os'); },
};
function renderModeBtn() {
  const toBrowser = Mode.current === 'os';
  const b = $('#mode-btn');
  b.replaceChildren(h('span', { class: 'swap' }, h('span', { svg: toBrowser ? ICONS.globe : ICONS.grid }), toBrowser ? 'Switch to Browser' : 'Switch to OS'));
  b.setAttribute('aria-label', toBrowser ? 'Switch to Browser only mode' : 'Switch back to the OS');
}
$('#mode-btn').addEventListener('click', () => Mode.toggle());

/* ---------- Global wiring ---------- */
$('#launcher-btn').addEventListener('click', () => togglePanel($('#launcher'), $('#launcher-btn')));
$('#bell-btn').addEventListener('click', () => togglePanel($('#notif-center'), $('#bell-btn')));
$('#notif-clear').addEventListener('click', () => Notify.clear());
$('#clock').addEventListener('click', () => WM.open('settings', { page: 'desktop' }));
$('#launcher-q').addEventListener('input', renderLauncher);
$('#launcher-q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const first = $('#launcher-list .app-row'); if (first) first.click(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); const first = $('#launcher-list .app-row'); if (first) first.focus(); }
});
$('#launcher-list').addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const rows = [...document.querySelectorAll('#launcher-list .app-row')], i = rows.indexOf(document.activeElement);
  const n = rows[i + (e.key === 'ArrowDown' ? 1 : -1)];
  if (n) n.focus(); else if (e.key === 'ArrowUp') $('#launcher-q').focus();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#launcher').hidden) { togglePanel($('#launcher'), $('#launcher-btn'), false); $('#launcher-btn').focus(); }
    else if (!$('#notif-center').hidden) { togglePanel($('#notif-center'), $('#bell-btn'), false); $('#bell-btn').focus(); }
  }
});
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#launcher,#launcher-btn,#notif-center,#bell-btn')) {
    if (!$('#launcher').hidden) togglePanel($('#launcher'), $('#launcher-btn'), false);
    if (!$('#notif-center').hidden) togglePanel($('#notif-center'), $('#bell-btn'), false);
  }
  if (!e.target.closest('.dicon')) document.querySelectorAll('.dicon.sel').forEach(x => x.classList.remove('sel'));
});
Bus.on('settings', ({ key }) => {
  applyAppearance();
  if (['*', 'wallpaper', 'dotMotion', 'reduceMotion', 'accent'].includes(key)) Dots.configure();
  if (key === '*' || key === 'clock24' || key === 'clockSeconds') startClock();
});
Bus.on('apps', () => { if (booted) { renderIcons(); renderLauncher(); } });

// Runtime errors outside an app's own error handling: report, keep the OS running.
let lastErr = 0;
function reportRuntime(msg) {
  console.error(msg);
  if (!booted) return;
  if (Date.now() - lastErr < 3000) return;
  lastErr = Date.now();
  Notify.push({ title: 'Something went wrong', body: String(msg).slice(0, 160) });
}
addEventListener('error', e => { if (e.message) reportRuntime(e.message); });
addEventListener('unhandledrejection', e => reportRuntime((e.reason && e.reason.message) || e.reason || 'A background task failed.'));

// This build uses no service worker. Remove any left at this address by an
// earlier deploy so it can't serve stale files.
try {
  if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    const base = new URL('./', location.href).href;
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => { if (r.scope.startsWith(base)) r.unregister(); })).catch(() => {});
  }
} catch (e) { console.warn('Service worker cleanup skipped:', e); }

/* ---------- Boot ---------- */
Settings.load();
applyAppearance();
renderIcons();
renderLauncher();
renderTaskbar();
renderNotifs();
startClock();
try { Dots.configure(); } catch (e) { console.error('Dot field disabled:', e); }
Mode.set(Store.get('mode', 'os') === 'browser' ? 'browser' : 'os', { save: false });
// Extension point for later apps: window.Nyx.registerApp({...}) (window.SNAP still works)
window.Nyx = window.SNAP = Object.freeze({ registerApp, registerShortcut, mode: m => Mode.set(m), open: (id, a) => WM.open(id, a), notify: (t, b) => Notify.push({ title: t, body: b }), net: BrowserNet, settings: { get: k => Settings.get(k) } });
booted = true;
clearTimeout(watchdog);
document.getElementById('boot').classList.add('done');
setTimeout(() => document.getElementById('boot').remove(), 500);
// First run: the customize screen, then (if turned on) the about:blank prompt.
try {
  if (!Store.get('customized', false)) Customize.open({ first: true, onClose: showLaunchPrompt });
  else showLaunchPrompt();
} catch (e) { console.error('Customize/launch skipped:', e); }

} catch (err) { fatal(err); }
})();
</script>
