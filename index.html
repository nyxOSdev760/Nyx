<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta name="theme-color" content="#000000">
<meta name="description" content="Kanni, a quiet desktop for the web.">
<title>Kanni</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ctext x='16' y='17' text-anchor='middle' dominant-baseline='central' font-size='24'%3E%F0%9F%91%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/widgets.css">
<link rel="stylesheet" href="css/lock.css">
<link rel="stylesheet" href="css/chat.css">
<script>
/* Before first paint: theme, accent and motion from saved settings, so there's no flash. */
(function(){try{var s=JSON.parse(localStorage.getItem('snap:settings')||'{}')||{},r=document.documentElement,t=s.theme;
if(t==='auto'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}else if(t!=='light'){t='dark';}r.dataset.theme=t;
if(/^#[0-9a-f]{6}$/i.test(s.accent||'')&&s.accent.toLowerCase()!=='#7aa2ff')r.style.setProperty('--accent',s.accent);
if(s.reduceMotion===true)r.dataset.motion='reduce';}catch(e){}})();
/* Startup watchdog: never hang on the boot screen. main.js calls KanniBoot.done(). */
window.KanniBoot=(function(){
  var finished=false,t0=Date.now();
  var timer=setTimeout(function(){if(!finished)fatal(new Error('Startup took too long and was stopped.'));},8000);
  function boot(){return document.getElementById('boot');}
  function fatal(err){
    if(finished)return;finished=true;clearTimeout(timer);
    try{console.error(err);}catch(e){}
    var f=document.getElementById('fatal');
    if(!f){document.addEventListener('DOMContentLoaded',function(){fatal2(err);});return;}
    fatal2(err);
  }
  function fatal2(err){
    document.getElementById('fatal-msg').textContent=(err&&(err.stack||err.message))||String(err);
    document.getElementById('fatal').hidden=false;
    var b=boot();if(b)b.remove();
  }
  function done(){
    if(finished)return;finished=true;clearTimeout(timer);
    var b=boot();if(!b)return;
    /* The mark fades in and out: keep it up just long enough to read, never longer than needed. */
    var wait=Math.max(0,380-(Date.now()-t0));
    setTimeout(function(){b.classList.add('done');setTimeout(function(){b.remove();},300);},wait);
  }
  /* A module that fails to load or throws while starting stops the boot. */
  addEventListener('error',function(e){if(!finished&&e.filename&&/\/js\/.+\.js/.test(e.filename))fatal(e.error||new Error(e.message));});
  return{done:done,fatal:fatal};
})();
</script>
<script type="module" src="js/main.js" onerror="KanniBoot.fatal(new Error('A file Kanni needs could not be loaded. Check your connection and reload.'))"></script>
</head>
<body data-wall="oled">
<div id="boot" role="status" aria-label="Starting Kanni"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="13" text-anchor="middle" dominant-baseline="central" font-size="21" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👾</text></svg></div>

<main id="desktop" aria-label="Desktop">
  <canvas id="dots" aria-hidden="true"></canvas>
  <div id="home-head" aria-hidden="true"><div id="home-time"></div><div id="home-date"></div></div>
  <div id="widgets" aria-label="Widgets"></div>
  <div id="icons" aria-label="Apps"></div>
  <div id="windows"></div>
</main>

<button class="bar" id="mode-btn" type="button"></button>

<nav class="bar" id="dock" aria-label="Dock">
  <div id="desktops" role="group" aria-label="Desktops"></div>
  <button class="dock-item" id="launcher-btn" type="button" aria-label="All apps" data-tip="All apps" aria-expanded="false" aria-controls="launcher"></button>
  <button class="dock-item" id="home-btn" type="button" aria-label="Home screen"></button>
  <div id="dock-apps" role="group" aria-label="Pinned apps"></div>
  <span id="dock-sep" aria-hidden="true" hidden></span>
  <div id="dock-running" role="group" aria-label="Open apps"></div>
</nav>

<div class="bar" id="status">
  <button class="st-btn" id="clock" type="button" aria-label="Clock. Opens clock settings"><span id="clock-time"></span><span id="clock-date"></span></button>
  <button class="st-btn" id="bell-btn" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notif-center"><span class="dot" hidden></span></button>
  <button class="st-btn" id="avatar-btn" type="button" aria-expanded="false" aria-controls="account-panel"></button>
</div>

<div id="launcher" class="panel" role="dialog" aria-label="All apps" hidden>
  <div class="panel-head">
    <label class="search"><span id="launcher-search-ico"></span><span class="sr">Search apps</span><input id="launcher-q" type="search" placeholder="Search apps and sites" autocomplete="off" spellcheck="false"></label>
  </div>
  <div id="launcher-list" class="app-list scroll"></div>
  <div class="panel-foot" id="launcher-foot"></div>
</div>

<div id="notif-center" class="panel" role="dialog" aria-label="Notifications" hidden>
  <div class="panel-head"><h2>Notifications</h2><button class="btn sm ghost" id="notif-clear" type="button">Clear all</button></div>
  <div id="notif-list" class="app-list scroll"></div>
</div>

<div id="account-panel" class="panel" role="dialog" aria-label="Account" hidden><div id="account-body"></div></div>

<div id="toasts" aria-live="polite"></div>

<div id="fatal" role="alert" hidden>
  <div>
    <h1>Kanni couldn't start</h1>
    <p>Something went wrong while loading. Saved settings may be damaged. Resetting them usually fixes this.</p>
    <pre id="fatal-msg"></pre>
    <div class="row"><button class="btn primary" id="fatal-reset" type="button" onclick="try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('snap:')===0)localStorage.removeItem(k);});}catch(e){}location.reload();">Reset settings and reload</button><button class="btn" type="button" onclick="location.reload()">Reload</button></div>
  </div>
</div>
</body>
</html>
